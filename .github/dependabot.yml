version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      # Hold at TypeScript 6.x. 7.0 is the native port and ships no public compiler
      # API, so anything reading it (our inheritdoc tsdown plugin,
      # eslint-plugin-perfectionist) cannot run on it. A new API is planned for 7.1.
      # Only the 7.0 series is ignored, so dependabot opens a PR by itself once 7.1
      # is out, and CI answers whether the toolchain has caught up.
      # See docs/adr/2026-07-26.typescript-7-hold.md.
      - dependency-name: "typescript"
        versions: ["7.0.x"]
    groups:
      eslint:
        patterns:
          - "@eslint/*"
          - "eslint*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
      testing:
        patterns:
          - vitest
      pipeline:
        patterns:
          - husky
          - "@commitlint/*"
          - multi-semantic-release
          - "@semantic-release/*"
      # Everything else that's a minor or patch bump lands in one weekly PR instead of one each.
      # These get auto-approved and merged, so splitting them up only buys more notifications.
      # The catch: one broken package holds the rest of the batch until it's sorted.
      minor-and-patch:
        update-types: ["minor", "patch"]
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
